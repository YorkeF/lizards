name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Deploy via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            dist/. $SSH_USER@$SSH_HOST:~/www/

          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            server/admin/. $SSH_USER@$SSH_HOST:~/www/admin/

          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            server/api/. $SSH_USER@$SSH_HOST:~/www/api/
