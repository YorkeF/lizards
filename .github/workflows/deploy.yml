name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy via scp
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" $SSH_USER@$SSH_HOST "mkdir -p ~/www ~/www/admin ~/www/api"

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -r dist/. $SSH_USER@$SSH_HOST:~/www/
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -r server/admin/. $SSH_USER@$SSH_HOST:~/www/admin/
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -r server/api/. $SSH_USER@$SSH_HOST:~/www/api/

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" $SSH_USER@$SSH_HOST "cd ~/lizards && git pull"
